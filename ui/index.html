<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEESKOT Studio</title>
<link rel="icon" href="look/beeskot.png">
<!-- Le look : exactement la base de Dari Audio Live (base.css + dari-look.css), puis les ajouts BEESKOT -->
<link rel="stylesheet" href="style/fonts.css">
<link rel="stylesheet" href="style/base.css">
<link rel="stylesheet" href="style/dari-look.css">
<link rel="stylesheet" href="style/beeskot.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="patch" src="look/logo-beeskot-studio.png" alt="DARI · BEESKOT Studio">
    <div class="sys" aria-label="État">
      <button class="estop" id="btStop" title="Relancer, fermer, version"><img src="look/stop-patch.png" alt=""><span class="led" id="stopLed"></span></button>
      <div class="sysgrid">
        <span class="vfd"><b>DATE</b> <span id="syDate">—</span><em id="syHeure">·</em></span>
        <span class="vfd"><b>DRIVE</b> <span id="syDrive">—</span><em id="syDriveD">·</em></span>
        <span class="vfd"><b>PC</b> <span id="syPc">—</span><em>·</em></span>
        <span class="vfd"><b>VERSION</b> <span id="syVer">—</span><em id="syMaj">·</em></span>
      </div>
    </div>
  </header>
  <div class="stripe" aria-hidden="true"></div>

  <div class="rowm">
    <div class="side">
      <nav id="nav" aria-label="Sections"><!-- rempli par js/coeur.js à partir de modules/registre.js --></nav>
    </div>
    <main class="mainc" id="pages"><!-- une <section> par module --></main>
  </div>
  <div class="mini-lect hidden" id="bkMini"></div>
</div>

<!-- fenêtre du bouton STOP : relancer / fermer / version -->
<div class="voile hidden" id="stopVoile">
  <div class="stopbox" role="dialog" aria-label="Logiciel">
    <span class="screw tl" style="--r:60deg"></span><span class="screw tr" style="--r:5deg"></span><span class="screw bl" style="--r:-30deg"></span><span class="screw br" style="--r:85deg"></span>
    <img class="stopbox-patch" src="look/logo-beeskot-studio.png" alt="">
    <div class="stopbox-ver"><span class="eng" style="font-size:9px">Version</span><span class="vfd" id="stVer">—</span></div>
    <div class="stopbox-suite">
      <span class="eng" style="font-size:9px">La suite DARI</span>
      <img class="patch-suite" src="look/suite/dari-audio-live.png" alt="DARI Audio Live">
      <img class="plaque-suite" src="look/suite/dari-visual-pro.png" alt="DARI Visual Pro">
      <img class="plaque-suite" src="look/suite/dari-visual-effects.png" alt="DARI Visual Effects">
    </div>
    <button class="btn pri hidden" id="stMaj" style="width:100%;justify-content:center">⬇ Installer la mise à jour</button>
    <div class="stopbox-btns">
      <button class="btn warm" id="stRelancer">↻ Relancer</button>
      <button class="btn" id="stFermer">✕ Fermer</button>
    </div>
    <button class="btn sm" id="stAnnuler">Annuler</button>
  </div>
</div>

<!-- 1. le cœur (outils communs)  2. la liste des onglets  3. un fichier par onglet -->
<script src="js/coeur.js"></script>
<script src="js/donnees.js"></script>
<script src="js/drive.js"></script>
<script src="js/audio.js"></script>
<script src="js/inventaire.js"></script>
<script src="js/ableton.js"></script>
<script src="js/dossiers.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/ia.js"></script>
<script src="js/discord.js"></script>
<script src="js/lib/mp4-muxer.js"></script>
<script src="js/rendu.js"></script>
<script src="js/minilecteur.js"></script>
<script src="modules/registre.js"></script>
<script src="modules/accueil.js"></script>
<script src="modules/reglages.js"></script>
<script src="modules/reels.js"></script>
<script src="modules/mixprep.js"></script>
<script src="modules/reelvis.js"></script>
<script src="modules/postvis.js"></script>
<script src="modules/biblio.js"></script>
<script src="modules/agenda.js"></script>
<script src="modules/taches.js"></script>
<script src="modules/medias.js"></script>
<script src="modules/tournage.js"></script>
<script src="modules/renforts.js"></script>
<script src="modules/lumieres.js"></script>
<script src="modules/en-construction.js"></script>
<script>BK.demarrer()</script>
</body>
</html>

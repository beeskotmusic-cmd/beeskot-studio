<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEESKOT Studio</title>
<link rel="icon" href="look/beeskot.png">
<!-- Le look : exactement la base de Dari Audio Live (base.css + dari-look.css), puis les ajouts BEESKOT -->
<link rel="stylesheet" href="style/fonts.css">
<link rel="stylesheet" href="style/base.css">
<link rel="stylesheet" href="style/dari-look.css">
<link rel="stylesheet" href="style/beeskot.css">
<link rel="stylesheet" href="style/externe.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="patch" src="look/logo-beeskot-studio.png" alt="DARI · BEESKOT Studio">
    <div class="sys" aria-label="État">
      <button class="estop jaune" id="btMiette" title="Miette relit tout : Discord, Drive, et prépare tous les onglets"><img src="look/patch-miette.png" alt=""><span class="led" id="mietteLed"></span></button>
      <button class="estop" id="btStop" title="Relancer, fermer, version"><img src="look/patch-dari.png" alt=""><span class="led" id="stopLed"></span></button>
      <div class="sysgrid">
        <span class="vfd" title="Ce que BEESKOT Studio utilise sur cet ordinateur"><b>CHARGE</b> <span id="syCpu">—</span><em id="syRam">·</em></span>
        <span class="vfd"><b>DRIVE</b> <span id="syDrive">—</span><em id="syDriveD">·</em></span>
        <span class="vfd sy-pc" id="syPcB" title="Qui utilise cet ordinateur (clic pour changer)"><b>PC :</b> <span id="syPc">—</span></span>
        <span class="vfd sy-online" id="syQui" title="Qui est sur BEESKOT Studio en ce moment"><b>ONLINE :</b><span class="sy-online-l" id="syQuiL">—</span></span>
        <span class="vfd"><b>VERSION</b> <span id="syVer">—</span><em id="syMaj">·</em></span>
      </div>
    </div>
  </header>
  <div class="stripe" aria-hidden="true"></div>

  <div class="rowm">
    <div class="side">
      <nav id="nav" aria-label="Sections"><!-- rempli par js/coeur.js à partir de modules/registre.js --></nav>
    </div>
    <button class="volet" id="btVolet" title="Replier le menu">‹</button>
    <main class="mainc" id="pages"><!-- une <section> par module --></main>
  </div>
  <div class="mini-lect hidden" id="bkMini"></div>
</div>

<!-- fenêtre du bouton STOP : relancer / fermer / version -->
<div class="voile hidden" id="stopVoile">
  <div class="stopbox" role="dialog" aria-label="Logiciel">
    <span class="screw tl" style="--r:60deg"></span><span class="screw tr" style="--r:5deg"></span><span class="screw bl" style="--r:-30deg"></span><span class="screw br" style="--r:85deg"></span>
    <img class="stopbox-patch" src="look/logo-beeskot-studio.png" alt="">
    <div class="stopbox-ver"><span class="eng" style="font-size:9px">Version</span><span class="vfd" id="stVer">—</span></div>
    <button class="btn warm" id="stAmeliorer" style="width:100%;justify-content:center">🔧 Améliorer BEESKOT Studio</button>
    <button class="btn sm" id="stNouveau" style="width:100%;justify-content:center">✨ Quoi de neuf dans cette version ?</button>
    <button class="btn sm" id="stVerif" style="width:100%;justify-content:center">🔍 Vérifier les mises à jour</button>
    <span class="nt" id="stVerifTxt" style="text-align:center;margin:0"></span>
    <button class="btn sm" id="stTuto" style="width:100%;justify-content:center">📖 Tuto et questions fréquentes</button>
    <div class="stopbox-suite">
      <span class="eng" style="font-size:9px">La suite DARI</span>
      <div class="suite-ligne">
        <img src="look/suite/dari-audio-live.png" alt="DARI Audio Live">
        <img src="look/suite/dari-visual-pro.png" alt="DARI Visual Pro">
        <img src="look/suite/dari-visual-effects.png" alt="DARI Visual Effects">
      </div>
    </div>
    <button class="btn pri hidden" id="stMaj" style="width:100%;justify-content:center">⬇ Installer la mise à jour</button>
    <div class="stopbox-btns">
      <button class="btn warm" id="stRelancer">↻ Relancer</button>
      <button class="btn" id="stFermer">✕ Fermer</button>
    </div>
    <button class="btn sm" id="stAnnuler">Annuler</button>
  </div>
</div>

</body>
</html>

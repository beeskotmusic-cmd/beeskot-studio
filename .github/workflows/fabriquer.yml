# Fabrique l'installeur Windows et publie la mise à jour.
# Se lance tout seul quand le numéro de version change (src-tauri/tauri.conf.json),
# ou à la main depuis l'onglet « Actions » de GitHub (bouton « Run workflow »).
name: Fabriquer BEESKOT Studio

on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'BEESKOT Studio v__VERSION__'
          releaseBody: 'Nouvelle version de BEESKOT Studio.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

[package]
name = "beeskot-studio"
version = "0.9.46"
description = "BEESKOT Studio - suite DARI"
edition = "2021"

[lib]
name = "beeskot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
ureq = "2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[profile.release]
# petit et léger
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false   # nécessaire pour les mises à jour automatiques
